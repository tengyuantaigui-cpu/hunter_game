<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="manifest" href="./manifest.json" />
    <title>TAP HUNTER</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/battle.css" />
    <link rel="stylesheet" href="./css/menu.css" />
    <link rel="stylesheet" href="./css/animation.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <div class="stat-card gold-card">
          <span class="stat-label">GOLD</span>
          <strong id="goldDisplay">0</strong>
        </div>

        <div class="title-card">
          <span class="title-mark">⚔</span>
          <span>TAP HUNTER</span>
        </div>

        <div class="stat-card stage-card">
          <span class="stat-label">STAGE</span>
          <strong id="stageDisplay">1</strong>
        </div>
      </header>

      <section class="hud-strip" aria-label="ゲーム情報">
        <div class="mini-card">
          <span>転生</span>
          <strong id="rebirthDisplay">0</strong>
        </div>
        <div class="mini-card">
          <span>所持</span>
          <strong id="inventoryDisplay">0</strong>
        </div>
        <div class="mini-card audio-box">
          <span>音声</span>
          <button id="audioToggle" class="audio-toggle" type="button">ON</button>
        </div>
      </section>

      <main class="battle-area" id="battleArea">
        <div class="enemy-panel">
          <div class="enemy-header">
            <span id="enemyName">ゴブリン</span>
            <span id="enemyLevel">Lv.1</span>
          </div>

          <button id="enemyButton" class="enemy-button goblin" type="button" aria-label="敵を攻撃">
            <span class="enemy-shadow"></span>
            <span class="enemy-body">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
              <span class="mouth"></span>
              <span class="weapon"></span>
            </span>
          </button>

          <div class="hp-box">
            <div class="hp-meta">
              <span>HP</span>
              <span id="hpText">120 / 120</span>
            </div>
            <div class="hp-bar">
              <div id="hpFill" class="hp-fill"></div>
            </div>
          </div>

          <div class="info-stack">
            <div id="dropBadge" class="drop-badge">ドロップ: なし</div>
            <div id="collectionPreview" class="collection-preview" aria-live="polite"></div>
          </div>

          <div id="battleHint" class="battle-hint">敵をタップして攻撃！</div>
        </div>

        <div id="damageLayer" class="damage-layer" aria-live="polite"></div>
      </main>

      <nav class="action-bar" aria-label="メニュー">
        <button class="action-btn primary" data-upgrade="atk" type="button">⚔ 攻撃</button>
        <button class="action-btn" data-upgrade="crit" type="button">💥 会心</button>
        <button class="action-btn" data-upgrade="hp" type="button">🛡 体力</button>
        <button class="action-btn secondary" id="equipmentBtn" type="button">⚙ 装備</button>
        <button class="action-btn secondary" id="saveBtn" type="button">💾 保存</button>
        <button class="action-btn secondary" id="rebirthBtn" type="button">♻ 転生</button>
        <button class="action-btn secondary" id="collectionBtn" type="button">📖 詳細</button>
      </nav>
    </div>

    <div id="modalLayer" class="modal-layer hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h3 id="modalTitle">図鑑</h3>
          <button id="closeModal" class="close-modal" type="button" aria-label="閉じる">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
